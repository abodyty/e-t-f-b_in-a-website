  cv.addEventListener("touchstart",e=>{for(const t of e.changedTouches){const el=document.elementFromPoint(t.clientX,t.clientY);if(el===cv&&cid===null){cid=t.identifier;cx0=t.clientX;cy0=t.clientY}}},{passive:true});
  cv.addEventListener("touchmove",e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier!==cid)continue;this.yaw-=(t.clientX-cx0)*.006;this.pitch=Math.max(.1,Math.min(1.3,this.pitch+(t.clientY-cy0)*.005));cx0=t.clientX;cy0=t.clientY}},{passive:false});
  cv.addEventListener("touchend",e=>{for(const t of e.changedTouches)if(t.identifier===cid)cid=null},{passive:true});
  /* jump button */
  $("btn-jump").addEventListener("touchstart",e=>{e.preventDefault();this.jump()},{passive:false});
  $("btn-shop").addEventListener("touchstart",e=>{e.preventDefault();if(Math.hypot(this.pos.x-102,this.pos.z+68)<10)UI.spd(!$("spd").classList.contains("on"))},{passive:false});
  let drag=0;
  R.ren.domElement.addEventListener("mousedown",e=>{if(e.button===2||e.button===0)drag=1});addEventListener("mouseup",()=>drag=0);R.ren.domElement.addEventListener("contextmenu",e=>e.preventDefault());
  addEventListener("mousemove",e=>{if(drag){this.yaw-=e.movementX*.005;this.pitch=Math.max(.1,Math.min(1.2,this.pitch+e.movementY*.004))}})},
 respawn(){this.pos.set(rnd(99,108),3,rnd(-40,40));this.vel.set(0,0,0)},
 jump(){const dj=S.items.djump||S.inf;if(this.ground||(dj&&this.jumps<2)||S.inf){this.vel.y=18;this.jumps=this.ground?1:this.jumps+1;this.ground=false;Snd.jump()}},
 step(dt){const k=this.keys,
  sp=16*S.spd*(1+.12*(S.items.spd||0))*(S.coil>0?1.5:1),
  jx=this._jx||0,jz=this._jz||0,
  fw=(k.s?1:0)-(k.w?1:0)+(jz),lr=(k.d?1:0)-(k.a?1:0)+(jx),
  sn=Math.sin(this.yaw),cs=Math.cos(this.yaw);
  let dx=sn*fw+cs*lr,dz=cs*fw-sn*lr;const l=Math.hypot(dx,dz)||1;
  const tx=(fw||lr||jx||jz)?dx/l*sp:0,tz=(fw||lr||jx||jz)?dz/l*sp:0;
  const acc=this.ground?18:7;
  this.vel.x+=(tx-this.vel.x)*Math.min(1,acc*dt);
  this.vel.z+=(tz-this.vel.z)*Math.min(1,acc*dt);
  this.vel.y-=36*S.gscale*dt;
  const py=this.pos.y;this.pos.x+=this.vel.x*dt;this.pos.z+=this.vel.z*dt;this.pos.y+=this.vel.y*dt;this.ground=false;
  Map3.boxes.forEach(b=>{const ox=Math.abs(this.pos.x-b.x)-(b.w/2+.5),oz=Math.abs(this.pos.z-b.z)-(b.d/2+.5);if(ox>=0||oz>=0)return;
   if(this.pos.y<b.h&&this.pos.y+1.6>0){if(py>=b.h-.05&&this.vel.y<=0){this.pos.y=b.h;this.vel.y=0;this.ground=true;this.jumps=0}
    else if(py+1.6<=0.05&&this.vel.y>0){this.pos.y=-1.6}
    else if(ox>oz){this.pos.x+=(this.pos.x>b.x?-ox:ox)}else{this.pos.z+=(this.pos.z>b.z?-oz:oz)}}});
  if(this.pos.y<=0&&this.vel.y<=0){this.pos.y=0;this.vel.y=0;this.ground=true;this.jumps=0}
  this.pos.x=Math.max(-122,Math.min(123,this.pos.x));this.pos.z=Math.max(-78,Math.min(78,this.pos.z));
  const na=!this.ground?2:(Math.abs(this.vel.x)+Math.abs(this.vel.z)>0.5)?1:0;if(na!==this.anim)this.anim=na;const m=this.mesh;m.position.copy(this.pos);R.animAvatar(m,this.anim,performance.now()/1000);
  
  if(Math.hypot(this.vel.x,this.vel.z)>0.5){
    const targetYaw=Math.atan2(this.vel.x,this.vel.z);
    let diff=targetYaw-m.rotation.y;
    while(diff<-Math.PI)diff+=Math.PI*2;
    while(diff>Math.PI)diff-=Math.PI*2;
    m.rotation.y+=diff*Math.min(1,15*dt);
  }

  m.visible=S.alive;
  if(S.items.trail&&this.anim&&(this.trailT-=dt)<0){this.trailT=.06;R.burst(this.pos.x,this.pos.y+.5,this.pos.z,Math.random()*0xffffff)}
  const d=this.dist;R.cam.position.set(this.pos.x+Math.sin(this.yaw)*d*Math.cos(this.pitch),this.pos.y+2+d*Math.sin(this.pitch),this.pos.z+Math.cos(this.yaw)*d*Math.cos(this.pitch));R.cam.lookAt(this.pos.x,this.pos.y+1.5,this.pos.z)}};

/* ===== WAVE + ROUND RULES ===== */
const Wave={height(){return Math.min(22,8+S.round*1.4)},speed(){return S.waveBase+S.round*4},
 step(dt){S.waveX+=S.waveSpd*dt;
  if(S.waveSpd>0&&S.alive&&!S.god&&Math.abs(P.pos.x-S.waveX)<5.2&&P.pos.y<this.height()&&!(P.pos.x>CFG.SAFEX)){S.alive=false;R.setCarry(null);Snd.boom();R.burst(P.pos.x,P.pos.y+1,P.pos.z,0x0077ff);UI.toast("🌊 Washed away! You are a ghost till next round.")}
  if(S.waveSpd>0&&S.waveX>=CFG.SAFEX-5){S.waveSpd=0;S.waveX=CFG.SAFEX}}};

const Round={host:{},tick(dt){if(!S.host)return;S.timer-=dt;
  if(S.phase==="waiting"&&S.timer<=0)this.to("active");
  else if(S.phase==="active"&&S.timer<=0)this.to("tsunami");
  else if(S.phase==="tsunami"&&S.waveX>=CFG.SAFEX&&!S.paused)this.to("over");
  else if(S.phase==="over"&&S.timer<=0)this.to("waiting")},
 to(p,silent){S.phase=p;if(p==="waiting"){S.timer=CFG.WAIT;S.waveSpd=0;S.waveX=CFG.X0;S.paused=false}
  if(p==="active")S.timer=CFG.ROUND;if(p==="tsunami"){S.waveX=CFG.X0;S.waveSpd=Wave.speed();S.timer=99;Net.ann("🌊 TSUNAMI INCOMING!",true)}
  if(p==="over"){S.timer=CFG.OVER;S.round++}
  Net.state();this.enter(p)},
 enter(p){
  if(p==="waiting"){S.alive=true;P.respawn()}
  if(p==="tsunami")Snd.horn();
  if(p==="over"&&S.alive){const g=10+(S.round-1)*5;S.pts+=g;S.cash+=g;S.surv++;Snd.coin();UI.toast(`🏆 Survived! +$${g}`);Net.saveProfile()}}};

/* ===== SUPABASE SYNC ===== */
const Net={sb:null,ch:null,online:false,
 init(){if(CFG.URL&&CFG.KEY&&window.supabase){this.sb=supabase.createClient(CFG.URL,CFG.KEY);this.online=true;
   this.ch=this.sb.channel("brainrot-arena",{config:{broadcast:{self:false},presence:{key:S.id}}});
   this.ch.on("broadcast",{event:"pos"},({payload:p})=>this.onPos(p))

    .on("broadcast",{event:"ann"},({payload:p})=>UI.announce(p.m))
    .on("broadcast",{event:"cmd"},({payload:p})=>Admin.exec(p))
    .on("presence",{event:"sync"},()=>{const ks=Object.keys(this.ch.presenceState()).sort();S.host=ks[0]===S.id;{const st=this.ch.presenceState();ks.forEach((k,i)=>R.setBase(i%8,(st[k]&&st[k][0]&&st[k][0].n||"?").slice(0,11)));for(let i=ks.length;i<8;i++)R.setBase(i,"Open Base");S.slot=Math.max(0,ks.indexOf(S.id))%8}
      S.peers.forEach((v,k)=>{if(!ks.includes(k)){R.sc.remove(v.mesh);S.peers.delete(k)}})})
    .subscribe(async st=>{if(st==="SUBSCRIBED"){await this.ch.track({n:S.name});}});
   this.sb.channel("an").on("postgres_changes",{event:"INSERT",schema:"public",table:"br_announcements"},({new:n})=>UI.announce(n.message)).subscribe();
   }else{S.host=true}},
 send(e,p){if(this.online&&this.ch)this.ch.send({type:"broadcast",event:e,payload:p})},
 pos(){this.send("pos",{id:S.id,n:S.name,x:P.pos.x,y:P.pos.y,z:P.pos.z,r:P.mesh.rotation.y,a:P.anim,c:P.col,t:S.items.trail?1:0,adm:S.admin,al:S.alive})},
 state(){this.send("state",{ph:S.phase,t:S.timer,r:S.round,wx:S.waveX,ws:S.waveSpd,wb:S.waveBase,pa:S.paused})},
 onPos(p){let o=S.peers.get(p.id);if(!o){o={mesh:R.avatar(p.n,p.c,p.adm),tp:new THREE.Vector3()};S.peers.set(p.id,o)}o.tp.set(p.x,p.y,p.z);o.r=p.r;o.mesh.visible=p.al;o.seen=performance.now();o.a=p.a},
 onState(p){if(S.host)return;const ch=p.ph!==S.phase;S.phase=p.ph;S.timer=p.t;S.round=p.r;S.waveSpd=p.ws;S.waveBase=p.wb;S.paused=p.pa;if(Math.abs(S.waveX-p.wx)>2||ch)S.waveX=p.wx;if(ch)Round.enter(p.ph)},

 sendChat(){const i=$("ci"),m=i.value.trim();i.blur();if(!m)return;const n=performance.now();if(n-S.lastChat<1500)return UI.toast("Slow down, chat spammer!");
  S.lastChat=n;i.value="";UI.chat(S.name,m,S.admin);this.send("chat",{n:S.name,m,a:S.admin})},

   const l=JSON.parse(localStorage.getItem(k)||"null");if(l){S.pts=l.pts;S.cash=l.cash||0;S.items=l.items;S.surv=l.surv||0}}catch(e){}},

   if(this.online)await this.sb.from("br_profiles").upsert({username:S.name,points:S.pts,items:S.items,updated_at:new Date().toISOString()})}catch(e){}UI.hud()}};

/* ===== ADMIN ===== */
const Admin={unlocked:false,
 exec(c){
  if(c.to&&c.to!==S.id&&c.to!=="all")return;
  switch(c.t){case"kick":if(c.to===S.id){UI.toast("You were kicked by an admin.");Net.ch&&Net.ch.unsubscribe();setTimeout(()=>location.reload(),1800)}break;
   case"god":S.god=c.v;UI.toast(c.v?"God mode ON":"God mode OFF");break;case"inf":S.inf=c.v;UI.toast(c.v?"Infinite jump ON":"OFF");break;
   case"speed":S.spd=c.v;break;case"meme":Snd.meme();R.rain();break;case"grav":S.gscale=.35;UI.toast("🌀 Gravity flip: floaty!");setTimeout(()=>S.gscale=1,10000);break;
   case"wave":if(S.host){S.paused=false;S.phase="tsunami";S.waveX=CFG.X0;S.waveSpd=Wave.speed();Net.state();Round.enter("tsunami")}break;
   case"wspeed":if(S.host){S.waveBase=c.v;if(S.waveSpd>0)S.waveSpd=Wave.speed();Net.state()}break;
   case"pause":if(S.host){S.paused=!S.paused;S._sv=S.paused?S.waveSpd:S._sv;S.waveSpd=S.paused?0:S._sv;Net.state()}break;
   case"start":if(S.host)Round.to("active");break;case"reset":if(S.host){S.round=1;Round.to("waiting")}break;
   case"item":R.burst(P.pos.x,P.pos.y+3,P.pos.z,0xff2e9a);Snd.meme();R.rain();break}},
 run(c){this.exec(Object.assign({},c,{to:c.to||"all"}));Net.send("cmd",Object.assign({},c,{to:c.to||"all"}))}};

/* ===== UI ===== */
const SHOP=[["djump","Double Jump 🦘",200],["trail","Aura Trail ✨",150]];
const UI={pop(t){const d=document.createElement("div");d.className="pop h";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1200)},spd(on){const m=$("spd");if(!on){m.classList.remove("on");return}m.classList.add("on");m.innerHTML="";
  const L=S.items.spd||0,cost=Math.round(50*Math.pow(1.6,L)),d=(t,css)=>{const e=document.createElement("div");e.textContent=t;if(css)e.style.cssText=css;m.append(e);return e},
   b=(t,f,dis)=>{const x=document.createElement("button");x.textContent=t;x.disabled=!!dis;x.style.margin="6px";x.onclick=f;m.append(x)};
  d("⚡ SPEED SHOP","font-size:26px;color:var(--sun)").className="h";d("Speed level "+L+"/10 · +"+L*12+"% run speed · you have "+S.pts+" pts");
  b(L>=10?"MAX LEVEL":"Upgrade → "+cost+" pts",()=>{if(S.pts<cost)return UI.toast("Not enough points");S.pts-=cost;S.items.spd=L+1;Snd.coin();Net.saveProfile();UI.spd(1)},L>=10);
  b("Speed Coil 60s — 100 pts",()=>{if(S.pts<100)return UI.toast("Not enough points");S.pts-=100;S.coil=60;Snd.coin();UI.toast("Speed Coil: +50% for 60s");UI.spd(1)});
  b("Close (E)",()=>UI.spd(0))},
zone(){const z=ZONES.find(z=>P.pos.x>=z[1]&&P.pos.x<z[2])||ZONES[0];const zn=P.pos.x>CFG.SAFEX?"Safe Zone":z[0];if(this._z!==zn){this._z=zn;$("zone").textContent=zn}$("b3").textContent=S.phase==="tsunami"?"NOW":S.phase==="active"?Math.ceil(S.timer):"…";$("b3").style.color=S.phase==="tsunami"?"#ff3b30":"#2bd65c";$("mb2").textContent="$"+S.cash.toLocaleString();$("mi2").textContent="$"+(R.rate||0).toFixed(1)+"/s";$("mc2").textContent=S.carry?S.carry.name:"nothing";$("ms2").textContent=S.surv;const nr=Math.hypot(P.pos.x-102,P.pos.z+68)<10;$("prompt").style.display=nr?"block":"none";if(!nr&&$("spd").classList.contains("on"))this.spd(0)},
hud(){},
 toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(this._t);this._t=setTimeout(()=>t.style.display="none",2800)},
 chat(n,m,a){const d=document.createElement("div");if(a){const b=document.createElement("span");b.className="adm";b.textContent="ADMIN";d.append(b)}
  const s=document.createElement("b");s.textContent=n+": ";s.style.color="#00e5ff";d.append(s,document.createTextNode(m));$("log").append(d);$("log").scrollTop=1e9},

 banner(){const t={waiting:"Next round in "+Math.ceil(S.timer)+"s",active:"CLIMB! "+Math.ceil(S.timer)+"s",tsunami:"🌊 TSUNAMI!",over:"Round over"}[S.phase];
  $("bt").textContent=S.paused?"⏸ Wave paused":t;$("bs").textContent=`Round ${S.round} · wave height ${Wave.height().toFixed(0)} · ${S.alive?"alive":"ghost"}`},
 admin(on){const m=$("modal");if(!on){m.classList.remove("on");return}m.classList.add("on");const b=$("mb");b.innerHTML="";
  if(!Admin.unlocked){const i=document.createElement("input");i.type="password";i.placeholder="PIN";const g=document.createElement("button");g.textContent="Unlock";
   g.onclick=()=>{if(i.value===CFG.PIN){Admin.unlocked=true;S.admin=true;P.mesh.userData.torso.material.color.set(0xff5fa2);this.admin(1)}else this.toast("Wrong PIN")};b.append(i,g);return}
  const add=(t,f)=>{const x=document.createElement("button");x.textContent=t;x.onclick=f;b.append(x)},row=t=>{const d=document.createElement("div");d.textContent=t;d.style.cssText="margin-top:8px;color:var(--sun)";b.append(d)};
  row("Announcement");const ai=document.createElement("input");ai.placeholder="message";ai.style.width="70%";b.append(ai);
  add("Send",async()=>{if(!ai.value)return;Net.ann(ai.value,true);if(Net.online)Net.sb.from("br_announcements").insert({message:ai.value}).then(()=>{});ai.value=""});
  row("Wave");add("Trigger now",()=>Admin.run({t:"wave"}));add("Pause/Resume",()=>Admin.run({t:"pause"}));add("Slow",()=>Admin.run({t:"wspeed",v:16}));add("Fast",()=>Admin.run({t:"wspeed",v:60}));
  row("Map");add("Force start",()=>Admin.run({t:"start"}));add("Reset",()=>Admin.run({t:"reset"}));add("Meme Rain",()=>Admin.run({t:"meme"}));add("Gravity Flip",()=>Admin.run({t:"grav"}));
  row("Me / everyone");add("God",()=>Admin.run({t:"god",v:true,to:S.id}));add("Inf jump",()=>Admin.run({t:"inf",v:true,to:S.id}));add("Speed x2",()=>Admin.run({t:"speed",v:2,to:S.id}));add("Spawn memes",()=>Admin.run({t:"item"}));
  row("Players");S.peers.forEach((v,id)=>{add("Kick "+id,()=>Admin.run({t:"kick",to:id}));add("God "+id,()=>Admin.run({t:"god",v:true,to:id}))})}};
window.UI=UI;

/* ===== MAIN ===== */
$("go").onclick=async()=>{const n=$("un").value.trim().replace(/[^\w ]/g,"").slice(0,14);if(!n)return;S.name=n;$("login").style.display="none";
 await Net.loadProfile();S.bank=Array.isArray(S.items.bank)?S.items.bank.filter(b=>b.k!==0):[];R.init();P.init();Net.init();R.setBase(0,S.name.slice(0,11));UI.hud();Snd.t(600,.1);
 let last=performance.now(),acc=0;(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1e3);last=now;
  P.step(dt);S.coil=Math.max(0,S.coil-dt);Wave.step(dt);Round.tick(dt);
  S.peers.forEach((o,id)=>{o.mesh.position.lerp(o.tp,Math.min(1,dt*12));o.mesh.rotation.y=o.r||0;R.animAvatar(o.mesh,o.a,now/1000);if(now-o.seen>5000){R.sc.remove(o.mesh);S.peers.delete(id)}});
  R.step(dt);acc+=dt;if(acc>.1){acc=0;Net.pos()}if(S.host&&((now|0)%4===0))Net.state();UI.banner();UI.zone();R.ren.render(R.sc,R.cam)})(last);
 setInterval(()=>S.host&&Net.state(),400);setInterval(()=>Net.saveProfile(),15000)};
$("un").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
</script></body></html>
